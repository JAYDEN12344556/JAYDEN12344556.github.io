<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMINI BOY - Handheld Console & Cartridge Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --shell-bg: #d4d2c8;
            --shell-shadow: #aba89e;
            --shell-highlight: #eeece4;
            --bezel-bg: #585660;
            --magenta-btn: #8f1d46;
            --magenta-btn-dark: #5e102b;
            --navy-text: #212963;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 20%, #262936 0%, #12131a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* Crisp 160x144 Native Pixel Rendering */
        #gb-canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Authentic LCD Dot Matrix Grid Overlay */
        .lcd-grid-overlay {
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.11) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.11) 1px, transparent 1px);
            background-size: 0.625% 0.6944%; /* 1/160 and 1/144 */
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.45), inset 0 0 2px rgba(0,0,0,0.6);
        }

        /* Classic DMG-01 Handheld Shell */
        .gb-shell {
            background: linear-gradient(145deg, #dcdad0 0%, #c8c5b9 100%);
            border-radius: 18px 18px 58px 18px;
            box-shadow: 
                inset 2px 3px 4px rgba(255, 255, 255, 0.75),
                inset -4px -6px 10px rgba(0, 0, 0, 0.25),
                0 25px 50px -12px rgba(0, 0, 0, 0.75),
                0 0 0 2px #9e9b90;
            position: relative;
        }

        /* Pocket Silver Shell Variant */
        .gb-shell.shell-pocket {
            background: linear-gradient(145deg, #d8dce0 0%, #b4bac2 100%);
            box-shadow: 
                inset 2px 3px 4px rgba(255, 255, 255, 0.8),
                inset -4px -6px 10px rgba(0, 0, 0, 0.3),
                0 25px 50px -12px rgba(0, 0, 0, 0.75),
                0 0 0 2px #858c94;
        }

        /* Atomic Midnight Shell Variant */
        .gb-shell.shell-midnight {
            background: linear-gradient(145deg, #323645 0%, #232631 100%);
            box-shadow: 
                inset 2px 3px 4px rgba(255, 255, 255, 0.15),
                inset -4px -6px 10px rgba(0, 0, 0, 0.5),
                0 25px 50px -12px rgba(0, 0, 0, 0.85),
                0 0 0 2px #1a1c24;
        }
        .gb-shell.shell-midnight .gb-logo-text {
            color: #93a3e8;
        }

        /* Screen Bezel */
        .gb-bezel {
            background: linear-gradient(160deg, #63616b 0%, #4d4b54 100%);
            border-radius: 12px 12px 34px 12px;
            box-shadow: 
                inset 0 3px 6px rgba(0,0,0,0.55),
                0 2px 1px rgba(255,255,255,0.6);
        }

        /* Battery LED */
        .battery-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a1212;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
            transition: all 0.25s ease;
        }
        .battery-led.on {
            background: #ff2a2a;
            box-shadow: 0 0 8px #ff2a2a, 0 0 14px #ff5555, inset 0 1px 2px #fff;
        }

        /* Tactile D-Pad */
        .dpad-arm {
            background: #232327;
            box-shadow: 
                inset 0 2px 2px rgba(255,255,255,0.18),
                0 4px 0 #111113,
                0 5px 6px rgba(0,0,0,0.45);
            transition: transform 0.05s ease, box-shadow 0.05s ease, background-color 0.05s;
        }
        .dpad-arm.active {
            background: #18181b;
            transform: translateY(2px);
            box-shadow: 
                inset 0 1px 2px rgba(0,0,0,0.6),
                0 1px 0 #111113,
                0 2px 3px rgba(0,0,0,0.4);
        }

        /* A and B Buttons */
        .ab-btn {
            background: radial-gradient(circle at 35% 30%, #ad2657 0%, #85163e 70%, #630e2d 100%);
            box-shadow: 
                inset 0 2px 3px rgba(255, 255, 255, 0.35),
                0 5px 0 #4a0920,
                0 7px 10px rgba(0, 0, 0, 0.45);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }
        .ab-btn:active, .ab-btn.active {
            transform: translateY(4px);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.2),
                0 1px 0 #4a0920,
                0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* Select / Start Rubber Pill Buttons */
        .pill-btn {
            width: 44px;
            height: 13px;
            background: linear-gradient(180deg, #6e6c78 0%, #4d4b55 100%);
            border-radius: 999px;
            transform: rotate(-26deg);
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.3),
                0 3px 0 #2e2d33,
                0 4px 5px rgba(0,0,0,0.35);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }
        .pill-btn:active, .pill-btn.active {
            transform: rotate(-26deg) translateY(2px);
            box-shadow: 
                inset 0 1px 2px rgba(0,0,0,0.4),
                0 1px 0 #2e2d33;
        }

        /* Speaker Grille Slots */
        .speaker-slot {
            width: 6px;
            height: 36px;
            background: #2b2a27;
            border-radius: 999px;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.85), 1px 0 0 rgba(255,255,255,0.45);
        }

        .gb-logo-text {
            color: var(--navy-text);
        }

        /* Realistic Game Boy Plastic Cartridge Styling */
        .gb-cartridge {
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
            border-radius: 6px 2px 5px 5px;
            box-shadow:
                inset 2px 2px 3px rgba(255, 255, 255, 0.45),
                inset -3px -3px 6px rgba(0, 0, 0, 0.45),
                0 8px 18px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
            position: relative;
        }
        .gb-cartridge:hover {
            transform: translateY(-4px) scale(1.015);
            box-shadow:
                inset 2px 2px 3px rgba(255, 255, 255, 0.55),
                inset -3px -3px 6px rgba(0, 0, 0, 0.45),
                0 14px 24px rgba(0, 0, 0, 0.65);
        }
        .gb-cartridge.inserted-active {
            outline: 2px solid #34d399;
            outline-offset: 2px;
        }

        /* Cartridge Shell Color Themes */
        .cart-shell-gold {
            background: linear-gradient(145deg, #ecd06f 0%, #c6992c 55%, #966f15 100%);
        }
        .cart-shell-grey {
            background: linear-gradient(145deg, #c2c0b6 0%, #9b988e 55%, #7c7970 100%);
        }
        .cart-shell-blue {
            background: linear-gradient(145deg, #3b82f6 0%, #1d4ed8 55%, #1e3a8a 100%);
        }
        .cart-shell-yellow {
            background: linear-gradient(145deg, #fde047 0%, #eab308 55%, #a16207 100%);
        }
        .cart-shell-red {
            background: linear-gradient(145deg, #f87171 0%, #dc2626 55%, #991b1b 100%);
        }

        /* Cartridge Grip Ribs */
        .cart-ribs {
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.28) 0px,
                rgba(0, 0, 0, 0.28) 2px,
                rgba(255, 255, 255, 0.22) 2px,
                rgba(255, 255, 255, 0.22) 4px
            );
        }

        /* Top-Slot Physical Cartridge Peeking Behind Console */
        .top-slot-cart {
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
            border-radius: 5px 2px 0 0;
            box-shadow:
                inset 2px 2px 2px rgba(255,255,255,0.4),
                inset -2px 0 4px rgba(0,0,0,0.4),
                0 -4px 12px rgba(0,0,0,0.5);
            transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease;
        }
        .top-slot-cart.ejected {
            transform: translateY(-42px);
            opacity: 0;
            pointer-events: none;
        }
        .top-slot-cart.inserting {
            transform: translateY(-34px);
        }
        .top-slot-cart.seated {
            transform: translateY(8px);
            opacity: 1;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- Top Toolbar & Hardware Controls -->
    <header class="w-full max-w-6xl flex flex-wrap items-center justify-between gap-2 bg-slate-900/80 backdrop-blur-md border border-slate-700/70 rounded-2xl px-3.5 py-2.5 shadow-xl mb-3">
        <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-bold text-xs pixel-font">GB</span>
            <div>
                <h1 class="text-xs sm:text-sm font-bold tracking-wider text-white flex items-center gap-2">
                    GEMINI BOY <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/30 text-indigo-300 border border-indigo-400/30 font-semibold">DMG-01 + GAME PAK RACK</span>
                </h1>
                <p class="text-[11px] text-slate-400 hidden sm:block">160×144 Dot-Matrix Simulator • Click Any Cartridge Below to Insert & Boot</p>
            </div>
        </div>

        <!-- Hardware & Display Options -->
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
            <!-- Inserted Cartridge Status Pill -->
            <div class="flex items-center gap-1.5 bg-slate-950/90 border border-slate-700 rounded-xl px-2.5 py-1 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" id="slot-status-dot"></span>
                <span class="text-slate-400 text-[11px]">SLOT-1:</span>
                <span id="header-cart-label" class="font-bold text-emerald-300 text-[11px] font-mono">DMG-4IN1-GOLD</span>
                <button onclick="ejectCartridge()" id="eject-btn" class="ml-1.5 px-2 py-0.5 rounded bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 text-[10px] font-bold transition" title="Eject Game Pak from Console">
                    ⏏ EJECT
                </button>
            </div>

            <!-- Palette Selector -->
            <button onclick="cyclePalette()" id="palette-btn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-semibold text-emerald-300 transition" title="Switch LCD Color Palette">
                <span class="w-2.5 h-2.5 rounded-full bg-[#8bac0f] inline-block" id="palette-dot"></span>
                <span id="palette-label">Classic Olive</span>
            </button>

            <!-- LCD Grid Toggle -->
            <button onclick="toggleLcdGrid()" id="grid-btn" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-semibold text-slate-200 transition" title="Toggle Pixel Matrix Grid">
                LCD Grid: ON
            </button>

            <!-- Audio Toggle -->
            <button onclick="toggleAudio()" id="audio-btn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-xs font-semibold text-emerald-300 transition">
                <span id="audio-icon">🔊</span>
                <span id="audio-label">8-Bit Audio</span>
            </button>
        </div>
    </header>

    <!-- Main Content: Handheld Console + Cartridge Library Rack & Manual -->
    <main class="w-full max-w-6xl flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6 my-auto py-1">

        <!-- AUTHENTIC GAME BOY HANDHELD CONSOLE -->
        <div class="relative flex flex-col items-center shrink-0">

            <!-- Animated Physical Cartridge Sticking Out of Top Slot -->
            <div class="w-[240px] sm:w-[264px] h-8 flex justify-center items-end overflow-visible z-0 relative">
                <div id="top-slot-cart" onclick="ejectCartridge()" title="Click to Eject Cartridge"
                    class="top-slot-cart seated cart-shell-gold w-[196px] sm:w-[214px] h-11 px-2 pt-1.5 flex flex-col items-center cursor-pointer">
                    <div class="w-full flex items-center justify-between gap-1">
                        <div class="w-5 h-3.5 cart-ribs rounded-xs"></div>
                        <div class="flex-1 h-4 rounded-full bg-black/25 shadow-inner flex items-center justify-center px-2 border border-white/15">
                            <span id="top-slot-code" class="text-[8px] font-black tracking-widest text-white/90 drop-shadow">DMG-4IN1-GOLD</span>
                        </div>
                        <div class="w-5 h-3.5 cart-ribs rounded-xs"></div>
                    </div>
                    <div id="top-slot-sticker" class="w-[88%] h-2.5 mt-1 rounded-t-xs bg-gradient-to-r from-amber-500 via-red-500 to-indigo-600 border-t border-x border-white/50"></div>
                </div>
            </div>

            <!-- Top Power Switch & Molding -->
            <div class="w-[290px] sm:w-[320px] flex justify-between items-center px-5 mb-[-3px] z-10">
                <button onclick="togglePower()" class="group flex items-center gap-1.5 bg-[#b8b5a8] hover:bg-[#c8c5b8] px-3 py-1 rounded-t-lg border-t border-x border-[#8f8c80] text-[10px] font-bold text-neutral-800 shadow-sm transition">
                    <span id="power-switch-pill" class="w-2.5 h-2.5 rounded-full bg-emerald-600 transition-transform transform translate-x-0"></span>
                    <span>◀ OFF•ON ▶</span>
                </button>
                <button onclick="cycleShell()" class="bg-[#b8b5a8] hover:bg-[#c8c5b8] px-2.5 py-1 rounded-t-lg border-t border-x border-[#8f8c80] text-[10px] font-bold text-neutral-700 transition">
                    SHELL COLOR
                </button>
            </div>

            <!-- The Console Body -->
            <div id="gb-shell" class="gb-shell w-[332px] sm:w-[366px] p-4 sm:p-5 flex flex-col select-none z-10">
                
                <!-- Top Groove Lines -->
                <div class="w-full border-b-2 border-black/15 pb-1.5 mb-2.5 flex justify-between items-center text-[9px] font-bold tracking-widest text-neutral-600/80">
                    <span>◁ OFF•ON ▷</span>
                    <span>DMG-01</span>
                </div>

                <!-- Dark Grey Screen Bezel -->
                <div class="gb-bezel w-full p-3 sm:p-4 flex flex-col items-center">
                    <!-- Bezel Top Header with Iconic Magenta & Navy Stripes -->
                    <div class="w-full flex flex-col gap-0.5 mb-2">
                        <div class="w-full h-[2px] bg-[#8f1d46]"></div>
                        <div class="flex items-center justify-between px-1 py-0.5">
                            <span class="text-[8px] sm:text-[9px] font-bold tracking-widest text-slate-200">DOT MATRIX WITH STEREO SOUND</span>
                        </div>
                        <div class="w-full h-[2px] bg-[#212963]"></div>
                    </div>

                    <!-- Battery Indicator + 160x144 Screen Container -->
                    <div class="w-full flex items-center gap-2.5 sm:gap-3 my-1">
                        <!-- Left Battery Column -->
                        <div class="flex flex-col items-center justify-center gap-1.5 w-8 sm:w-9">
                            <div id="battery-led" class="battery-led on"></div>
                            <span class="text-[7px] sm:text-[8px] font-bold tracking-wider text-slate-300">BATTERY</span>
                        </div>

                        <!-- 160x144 Native Aspect Ratio LCD Screen (10:9) -->
                        <div class="relative flex-1 aspect-[160/144] rounded-md overflow-hidden border-4 border-[#272924] shadow-inner bg-[#9bbc0f]">
                            <canvas id="gb-canvas" width="160" height="144"></canvas>
                            <div id="lcd-grid" class="lcd-grid-overlay absolute inset-0 pointer-events-none"></div>
                        </div>
                    </div>
                </div>

                <!-- Nintendo / Gemini Boy Brand Emblem -->
                <div class="w-full flex items-baseline justify-between px-2 mt-2.5 mb-3">
                    <div class="flex items-baseline gap-1.5">
                        <span class="gb-logo-text font-extrabold italic tracking-tight text-sm sm:text-base">GEMINI</span>
                        <span class="gb-logo-text font-black tracking-wider text-base sm:text-lg pixel-font">GAME BOY</span>
                        <span class="gb-logo-text text-[10px] font-bold">TM</span>
                    </div>
                    <span id="active-cart-badge" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-black/10 text-neutral-700 uppercase">4-IN-1</span>
                </div>

                <!-- Controls Area: D-Pad on Left, Angled B & A on Right -->
                <div class="w-full flex items-center justify-between px-2 sm:px-3 my-2">
                    
                    <!-- Tactile Cross D-Pad -->
                    <div class="relative w-28 h-28 sm:w-32 sm:h-32 flex items-center justify-center">
                        <!-- Subtle Recessed Circle Behind D-Pad -->
                        <div class="absolute inset-1 rounded-full bg-black/5 shadow-inner pointer-events-none"></div>

                        <!-- Center Pivot -->
                        <div class="w-9 h-9 bg-[#232327] z-10 flex items-center justify-center pointer-events-none">
                            <div class="w-5 h-5 rounded-full bg-[#1a1a1d] shadow-inner"></div>
                        </div>

                        <!-- UP Button -->
                        <button id="btn-up" data-key="UP" aria-label="Up"
                            class="dpad-arm absolute top-1.5 w-9 h-10 rounded-t-md flex flex-col items-center justify-start pt-1.5 z-20 cursor-pointer">
                            <span class="w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-b-[7px] border-b-neutral-500 mb-1"></span>
                            <span class="w-5 h-0.5 bg-neutral-700 rounded"></span>
                        </button>

                        <!-- DOWN Button -->
                        <button id="btn-down" data-key="DOWN" aria-label="Down"
                            class="dpad-arm absolute bottom-1.5 w-9 h-10 rounded-b-md flex flex-col items-center justify-end pb-1.5 z-20 cursor-pointer">
                            <span class="w-5 h-0.5 bg-neutral-700 rounded mb-1"></span>
                            <span class="w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-t-[7px] border-t-neutral-500"></span>
                        </button>

                        <!-- LEFT Button -->
                        <button id="btn-left" data-key="LEFT" aria-label="Left"
                            class="dpad-arm absolute left-1.5 w-10 h-9 rounded-l-md flex items-center justify-start pl-1.5 z-20 cursor-pointer">
                            <span class="w-0 h-0 border-t-[5px] border-t-transparent border-b-[5px] border-b-transparent border-r-[7px] border-r-neutral-500 mr-1"></span>
                            <span class="w-0.5 h-5 bg-neutral-700 rounded"></span>
                        </button>

                        <!-- RIGHT Button -->
                        <button id="btn-right" data-key="RIGHT" aria-label="Right"
                            class="dpad-arm absolute right-1.5 w-10 h-9 rounded-r-md flex items-center justify-end pr-1.5 z-20 cursor-pointer">
                            <span class="w-0.5 h-5 bg-neutral-700 rounded mr-1"></span>
                            <span class="w-0 h-0 border-t-[5px] border-t-transparent border-b-[5px] border-b-transparent border-l-[7px] border-l-neutral-500"></span>
                        </button>
                    </div>

                    <!-- Angled B and A Buttons Capsule -->
                    <div class="relative flex items-center gap-4 sm:gap-5 px-3.5 py-2.5 rounded-full bg-black/10 shadow-inner -rotate-[25deg]">
                        <!-- B Button -->
                        <div class="flex flex-col items-center">
                            <button id="btn-b" data-key="B" aria-label="B Button"
                                class="ab-btn w-11 h-11 sm:w-12 sm:h-12 rounded-full cursor-pointer"></button>
                            <span class="gb-logo-text font-black tracking-widest text-xs sm:text-sm mt-1.5 select-none">B</span>
                        </div>
                        <!-- A Button -->
                        <div class="flex flex-col items-center">
                            <button id="btn-a" data-key="A" aria-label="A Button"
                                class="ab-btn w-11 h-11 sm:w-12 sm:h-12 rounded-full cursor-pointer"></button>
                            <span class="gb-logo-text font-black tracking-widest text-xs sm:text-sm mt-1.5 select-none">A</span>
                        </div>
                    </div>
                </div>

                <!-- Bottom Area: SELECT / START Pills & Speaker Grille -->
                <div class="w-full flex items-end justify-between mt-4 mb-1 px-3">
                    <div class="w-12"></div>

                    <!-- SELECT & START -->
                    <div class="flex items-center gap-6 sm:gap-7 mb-2">
                        <div class="flex flex-col items-center">
                            <button id="btn-select" data-key="SELECT" aria-label="Select" class="pill-btn cursor-pointer"></button>
                            <span class="gb-logo-text text-[9px] font-extrabold tracking-widest mt-2.5">SELECT</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <button id="btn-start" data-key="START" aria-label="Start" class="pill-btn cursor-pointer"></button>
                            <span class="gb-logo-text text-[9px] font-extrabold tracking-widest mt-2.5">START</span>
                        </div>
                    </div>

                    <!-- Angled Speaker Grille -->
                    <div class="flex items-center gap-1.5 -rotate-[28deg] mr-1 mb-1 opacity-90">
                        <div class="speaker-slot"></div>
                        <div class="speaker-slot"></div>
                        <div class="speaker-slot"></div>
                        <div class="speaker-slot"></div>
                        <div class="speaker-slot"></div>
                        <div class="speaker-slot"></div>
                    </div>
                </div>

                <!-- Bottom Headphone Engraving -->
                <div class="w-full flex justify-center mt-1">
                    <span class="text-[8px] font-bold tracking-widest text-neutral-600/70 bg-black/5 px-2 py-0.5 rounded-full">🎧 PHONES</span>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE PANEL: Interactive Game Boy Cartridge Rack + Active Manual -->
        <aside class="w-full max-w-2xl flex-1 flex flex-col gap-3.5">

            <!-- INTERACTIVE PHYSICAL CARTRIDGE RACK -->
            <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4 shadow-2xl">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3 mb-3.5">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">GAME PAK LIBRARY</span>
                            <span class="text-[11px] text-slate-400">6 Official Cartridges</span>
                        </div>
                        <h2 class="text-sm sm:text-base font-extrabold text-white mt-1">Select a Cartridge to Insert into Slot-1</h2>
                    </div>

                    <!-- Category Filter Pills -->
                    <div class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-[11px]">
                        <button onclick="filterCartRack('ALL')" id="filter-ALL" class="px-2.5 py-1 rounded-lg font-semibold bg-emerald-600 text-white transition">All (6)</button>
                        <button onclick="filterCartRack('ACTION')" id="filter-ACTION" class="px-2 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition">Action</button>
