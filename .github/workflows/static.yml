        function updateAndDrawMenu() {
            menuAnimTick++;
            updateBGM('MENU', true);

            if (justPressed.UP) {
                menuCursor = (menuCursor + CARTRIDGES.length - 1) % CARTRIDGES.length;
                SFX.cursor();
            }
            if (justPressed.DOWN) {
                menuCursor = (menuCursor + 1) % CARTRIDGES.length;
                SFX.cursor();
            }
            if (justPressed.A || justPressed.START) {
                switchCartridge(CARTRIDGES[menuCursor].id);
                return;
            }

            clearScreen(3);

            // Top Banner
            fillRect(0, 0, SCREEN_W, 20, 0);
            fillRect(2, 2, SCREEN_W - 4, 16, 1);
            drawTextCentered('GEMINI 5-IN-1 GOLD', 4, 3, 1);
            drawTextCentered('SELECT GAME PAK', 11, 2, 1);

            // Game List Box (5 games, 18px each)
            strokeRect(5, 22, 150, 94, 0);
            fillRect(7, 24, 146, 90, 2);

            for (let i = 0; i < CARTRIDGES.length; i++) {
                const rowY = 26 + i * 17;
                const isSelected = (i === menuCursor);

                if (isSelected) {
                    fillRect(9, rowY, 142, 15, 0);
                    if (Math.floor(menuAnimTick / 15) % 2 === 0) {
                        drawText('>', 12, rowY + 5, 3, 1);
                    }
                    drawSprite(MENU_ICONS[i], 20, rowY + 3, 1);
                    drawText(CARTRIDGES[i].title.slice(0, 14), 31, rowY + 2, 3, 1);
                    drawText('HI:' + (highScores[CARTRIDGES[i].id] || 0), 31, rowY + 9, 2, 1);
                } else {
                    fillRect(9, rowY, 142, 15, 3);
                    drawSprite(MENU_ICONS[i], 20, rowY + 3, 1);
                    drawText(CARTRIDGES[i].title.slice(0, 15), 31, rowY + 5, 0, 1);
                }
            }

            // Bottom Footer
            fillRect(5, 118, 150, 22, 0);
            drawTextCentered(CARTRIDGES[menuCursor].genre, 121, 3, 1);
            if (Math.floor(menuAnimTick / 25) % 2 === 0) {
                drawTextCentered('PRESS START OR A', 130, 2, 1);
            }
        }

