                                <span class="text-slate-400">B Button</span>
                                <kbd class="px-1.5 py-0.5 bg-slate-950 rounded text-[10px] font-mono text-pink-300 border border-slate-700">Z / J</kbd>
                            </div>
                            <div class="bg-slate-800/70 rounded-lg px-2 py-1.5 border border-slate-700/60 flex items-center justify-between">
                                <span class="text-slate-400">START/SEL</span>
                                <kbd class="px-1.5 py-0.5 bg-slate-950 rounded text-[10px] font-mono text-amber-300 border border-slate-700">Enter / Shift</kbd>
                            </div>
                        </div>
                    </div>

                    <!-- High Scores & Cartridge Memory -->
                    <div class="bg-slate-900/85 border border-slate-700/80 rounded-2xl p-3.5 shadow-xl">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Cartridge Battery SRAM</h3>
                            <span class="text-[10px] text-emerald-400 font-mono">SAVED OK</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[11px]">
                            <div class="bg-slate-950/60 rounded-lg px-2 py-1 border border-slate-800 flex justify-between">
                                <span class="text-slate-400">Quest:</span>
                                <span id="hi-QUEST" class="font-mono font-bold text-emerald-400">0</span>
                            </div>
                            <div class="bg-slate-950/60 rounded-lg px-2 py-1 border border-slate-800 flex justify-between">
                                <span class="text-slate-400">Tetra:</span>
                                <span id="hi-TETRA" class="font-mono font-bold text-emerald-400">0</span>
                            </div>
                            <div class="bg-slate-950/60 rounded-lg px-2 py-1 border border-slate-800 flex justify-between">
                                <span class="text-slate-400">Star:</span>
                                <span id="hi-STAR" class="font-mono font-bold text-emerald-400">0</span>
                            </div>
                            <div class="bg-slate-950/60 rounded-lg px-2 py-1 border border-slate-800 flex justify-between">
                                <span class="text-slate-400">Snake:</span>
                                <span id="hi-SNAKE" class="font-mono font-bold text-emerald-400">0</span>
                            </div>
                            <div class="bg-slate-950/60 rounded-lg px-2 py-1 border border-slate-800 flex justify-between col-span-2 sm:col-span-2">
                                <span class="text-slate-400">Turbo Racer GB:</span>
                                <span id="hi-RACE" class="font-mono font-bold text-amber-400">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </aside>
    </main>

    <script>
        /***********************************************************************
         * 1. HARDWARE SPECIFICATIONS, PALETTES & BITMAP FONT (160x144)
         ***********************************************************************/
        const SCREEN_W = 160;
        const SCREEN_H = 144;
        const canvas = document.getElementById('gb-canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // Authentic 4-Shade Game Boy Palettes (0 = Darkest Ink, 3 = Lightest LCD Background)
        const PALETTES = [
            {
                name: 'Classic Olive',
                colors: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f']
            },
            {
                name: 'Pocket Mono',
                colors: ['#181818', '#4a5138', '#8c926b', '#c5caa4']
            },
            {
                name: 'Light Backlit',
                colors: ['#06262e', '#0d6375', '#28a89e', '#8cf5e8']
            },
            {
                name: 'Amber Gold',
                colors: ['#2b1321', '#6e273d', '#b85340', '#f5c26b']
            }
        ];

        let currentPaletteIdx = 0;
        let pal = PALETTES[0].colors;
        let powerOn = true;
        let lcdGridOn = true;
        let shellIdx = 0;
        const SHELL_CLASSES = ['', 'shell-pocket', 'shell-midnight'];

        // High Scores (persisted in memory/localStorage safely)
        const highScores = {
            QUEST: 0,
            TETRA: 0,
            STAR: 0,
            SNAKE: 0,
            RACE: 0
        };
        try {
            const saved = localStorage.getItem('gemini_boy_sram');
            if (saved) Object.assign(highScores, JSON.parse(saved));
        } catch (e) {}

        function saveHighScore(gameKey, score) {
            if (score > (highScores[gameKey] || 0)) {
                highScores[gameKey] = score;
                const el = document.getElementById('hi-' + gameKey);
                if (el) el.textContent = score;
                try {
                    localStorage.setItem('gemini_boy_sram', JSON.stringify(highScores));
                } catch (e) {}
            }
        }
        Object.keys(highScores).forEach(k => {
            const el = document.getElementById('hi-' + k);
            if (el) el.textContent = highScores[k];
        });

        // 5x5 Pixel Bitmap Font for crisp native 160x144 text rendering
        const FONT_5X5 = {
            'A': ['01110','10001','11111','10001','10001'],
            'B': ['11110','10001','11110','10001','11110'],
            'C': ['01111','10000','10000','10000','01111'],
            'D': ['11110','10001','10001','10001','11110'],
            'E': ['11111','10000','11110','10000','11111'],
            'F': ['11111','10000','11110','10000','10000'],
            'G': ['01111','10000','10111','10001','01111'],
            'H': ['10001','10001','11111','10001','10001'],
            'I': ['11111','00100','00100','00100','11111'],
            'J': ['00111','00010','00010','10010','01100'],
            'K': ['10001','10010','11100','10010','10001'],
            'L': ['10000','10000','10000','10000','11111'],
            'M': ['10001','11011','10101','10001','10001'],
            'N': ['10001','11001','10101','10011','10001'],
            'O': ['01110','10001','10001','10001','01110'],
            'P': ['11110','10001','11110','10000','10000'],
            'Q': ['01110','10001','10101','10010','01101'],
            'R': ['11110','10001','11110','10010','10001'],
            'S': ['01111','10000','01110','00001','11110'],
            'T': ['11111','00100','00100','00100','00100'],
            'U': ['10001','10001','10001','10001','01110'],
            'V': ['10001','10001','10001','01010','00100'],
            'W': ['10001','10001','10101','11011','10001'],
            'X': ['10001','01010','00100','01010','10001'],
            'Y': ['10001','01010','00100','00100','00100'],
            'Z': ['11111','00010','00100','01000','11111'],
            '0': ['01110','10011','10101','11001','01110'],
            '1': ['00100','01100','00100','00100','01110'],
            '2': ['11110','00001','01110','10000','11111'],
            '3': ['11110','00001','00110','00001','11110'],
            '4': ['10010','10010','11111','00010','00010'],
            '5': ['11111','10000','11110','00001','11110'],
            '6': ['01111','10000','11110','10001','01110'],
            '7': ['11111','00001','00010','00100','00100'],
            '8': ['01110','10001','01110','10001','01110'],
            '9': ['01110','10001','01111','00001','11110'],
            ':': ['00000','00100','00000','00100','00000'],
            '-': ['00000','00000','11111','00000','00000'],
            '.': ['00000','00000','00000','00000','00100'],
            '!': ['00100','00100','00100','00000','00100'],
            '?': ['01110','00001','00110','00000','00100'],
            '/': ['00001','00010','00100','01000','10000'],
            '>': ['10000','01000','00100','01000','10000'],
            '<': ['00001','00010','00100','00010','00001'],
            '+': ['00000','00100','01110','00100','00000'],
            ' ': ['00000','00000','00000','00000','00000']
        };

        // Drawing Primitives on 160x144 Canvas using 4-shade palette index (0..3)
        function clearScreen(shade = 3) {
            ctx.fillStyle = pal[shade];
            ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
        }

        function fillRect(x, y, w, h, shade = 0) {
            ctx.fillStyle = pal[shade];
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function strokeRect(x, y, w, h, shade = 0) {
            ctx.fillStyle = pal[shade];
            x = Math.floor(x); y = Math.floor(y); w = Math.floor(w); h = Math.floor(h);
            ctx.fillRect(x, y, w, 1);
            ctx.fillRect(x, y + h - 1, w, 1);
            ctx.fillRect(x, y, 1, h);
            ctx.fillRect(x + w - 1, y, 1, h);
        }

        function drawText(text, x, y, shade = 0, scale = 1) {
            const str = String(text).toUpperCase();
            ctx.fillStyle = pal[shade];
            let curX = Math.floor(x);
            const startY = Math.floor(y);
            for (let i = 0; i < str.length; i++) {
                const glyph = FONT_5X5[str[i]] || FONT_5X5[' '];
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        if (glyph[r][c] === '1') {
                            ctx.fillRect(curX + c * scale, startY + r * scale, scale, scale);
                        }
                    }
                }
                curX += 6 * scale;
            }
        }

        function drawTextCentered(text, y, shade = 0, scale = 1) {
            const str = String(text);
            const width = str.length * 6 * scale - scale;
            const x = Math.floor((SCREEN_W - width) / 2);
            drawText(str, x, y, shade, scale);
        }

        // Draw an 8x8 or NxN pixel sprite from array of strings ('0'..'3' = shade, '.' = transparent)
        function drawSprite(spriteRows, x, y, scale = 1, flipX = false) {
            const sx = Math.floor(x);
            const sy = Math.floor(y);
            const h = spriteRows.length;
            const w = spriteRows[0].length;
            for (let r = 0; r < h; r++) {
                const row = spriteRows[r];
                for (let c = 0; c < w; c++) {
                    const ch = row[flipX ? (w - 1 - c) : c];
                    if (ch !== '.') {
                        ctx.fillStyle = pal[parseInt(ch, 10)];
                        ctx.fillRect(sx + c * scale, sy + r * scale, scale, scale);
                    }
                }
            }
        }

        /***********************************************************************
         * 2. SYNTHESIZED 8-BIT CHIPTUNE AUDIO ENGINE (WEB AUDIO API)
         ***********************************************************************/
        let audioCtx = null;
        let audioEnabled = true;
        let bgmStep = 0;
        let bgmTimer = 0;

        function ensureAudio() {
            if (!audioEnabled) return false;
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return !!audioCtx;
        }

        // Play an 8-bit square or triangle wave tone
        function playTone(freq, duration = 0.08, type = 'square', vol = 0.06, slideTo = null) {
            if (!ensureAudio()) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (slideTo) {
                    osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
                }
                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {}
        }

        // Play 8-bit white noise burst (explosions, sword slashes, percussion)
        function playNoise(duration = 0.1, vol = 0.06, bandFreq = 1000) {
            if (!ensureAudio()) return;
            try {
                const now = audioCtx.currentTime;
                const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = bandFreq;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } catch (e) {}
        }

        // Iconic Game Boy Sound Effects
        const SFX = {
            bootDing() {
                playTone(1046.5, 0.09, 'square', 0.08);
                setTimeout(() => playTone(2093.0, 0.45, 'square', 0.08), 85);
            },
            bootError() {
                playTone(130.8, 0.35, 'sawtooth', 0.07, 98.0);
            },
            cartClunk() {
                playNoise(0.045, 0.12, 420);
                playTone(140, 0.06, 'triangle', 0.09, 75);
                setTimeout(() => {
                    playNoise(0.035, 0.1, 780);
                    playTone(210, 0.05, 'square', 0.06, 120);
                }, 55);
            },
            cartEject() {
                playNoise(0.05, 0.09, 900);
                playTone(190, 0.06, 'triangle', 0.07, 310);
            },
            cursor() {
                playTone(660, 0.04, 'square', 0.05);
            },
            select() {
                playTone(523.25, 0.06, 'square', 0.07);
                setTimeout(() => playTone(1046.5, 0.12, 'square', 0.07), 55);
            },
            sword() {
                playNoise(0.07, 0.06, 1800);
                playTone(420, 0.07, 'square', 0.04, 180);
            },
            hit() {
                playNoise(0.11, 0.08, 600);
                playTone(160, 0.1, 'sawtooth', 0.06, 70);
            },
            pickup() {
                playTone(587.33, 0.06, 'square', 0.07);
                setTimeout(() => playTone(880, 0.08, 'square', 0.07), 60);
                setTimeout(() => playTone(1174.66, 0.14, 'square', 0.07), 120);
            },
            laser() {
                playTone(1100, 0.06, 'square', 0.045, 280);
            },
            explosion() {
                playNoise(0.24, 0.1, 350);
            },
            rotate() {
                playTone(740, 0.04, 'triangle', 0.06, 980);
            },
            drop() {
                playTone(220, 0.05, 'triangle', 0.07, 110);
            },
            lineClear() {
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((n, idx) => {
                    setTimeout(() => playTone(n, 0.09, 'square', 0.07), idx * 55);
                });
            },
            gameOver() {
                const notes = [440, 415.3, 392, 349.23];
                notes.forEach((n, idx) => {
                    setTimeout(() => playTone(n, 0.18, 'square', 0.06), idx * 140);
                });
            },
            victory() {
                const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
                const delays = [0, 100, 200, 300, 450, 580];
                notes.forEach((n, idx) => {
                    setTimeout(() => playTone(n, 0.14, 'square', 0.08), delays[idx]);
                });
            }
        };

        // Background Chiptune Sequencer per Cartridge
        const BGM_TRACKS = {
            MENU: [261.6, 329.6, 392.0, 523.3, 392.0, 329.6, 293.7, 349.2],
            QUEST: [220.0, 261.6, 329.6, 220.0, 246.9, 293.7, 392.0, 293.7, 261.6, 329.6, 440.0, 329.6, 196.0, 246.9, 293.7, 246.9],
            TETRA: [659.3, 493.9, 523.3, 587.3, 523.3, 493.9, 440.0, 440.0, 523.3, 659.3, 587.3, 523.3, 493.9, 523.3, 587.3, 659.3],
            STAR: [164.8, 164.8, 329.6, 164.8, 196.0, 164.8, 220.0, 246.9, 146.8, 146.8, 293.7, 146.8, 174.6, 146.8, 196.0, 220.0],
            SNAKE: [329.6, 392.0, 440.0, 392.0, 523.3, 440.0, 392.0, 329.6],
            RACE: [196.0, 196.0, 293.7, 392.0, 261.6, 261.6, 329.6, 440.0, 220.0, 293.7, 349.2, 440.0, 246.9, 329.6, 392.0, 493.9]
        };

        function updateBGM(activeCart, isPlayingState) {
            if (!powerOn || !audioEnabled || !isPlayingState) return;
            bgmTimer++;
            const tempo = (activeCart === 'STAR' || activeCart === 'RACE') ? 8 : (activeCart === 'TETRA' ? 11 : 13);
            if (bgmTimer >= tempo) {
                bgmTimer = 0;
                const track = BGM_TRACKS[activeCart] || BGM_TRACKS.MENU;
                const freq = track[bgmStep % track.length];
                bgmStep++;
                if (freq) {
                    playTone(freq, 0.07, (activeCart === 'STAR' || activeCart === 'RACE') ? 'triangle' : 'square', 0.022);
                }
            }
        }

        /***********************************************************************
         * 3. INPUT CONTROLLER (KEYBOARD + MULTI-TOUCH / MOUSE)
         ***********************************************************************/
        const keys = {
            UP: false,
            DOWN: false,
            LEFT: false,
            RIGHT: false,
            A: false,
            B: false,
            START: false,
            SELECT: false
        };

        const justPressed = {
            UP: false,
            DOWN: false,
            LEFT: false,
            RIGHT: false,
            A: false,
            B: false,
            START: false,
            SELECT: false
        };

        function setKeyState(keyName, isDown) {
            if (isDown && !keys[keyName]) {
                justPressed[keyName] = true;
                ensureAudio();
            }
            keys[keyName] = isDown;

            // Update visual button active state
            const btnMap = {
                UP: 'btn-up',
                DOWN: 'btn-down',
                LEFT: 'btn-left',
                RIGHT: 'btn-right',
                A: 'btn-a',
                B: 'btn-b',
                START: 'btn-start',
                SELECT: 'btn-select'
            };
            const el = document.getElementById(btnMap[keyName]);
            if (el) {
                el.classList.toggle('active', isDown);
            }
        }

        function clearJustPressed() {
            for (const k in justPressed) {
                justPressed[k] = false;
            }
        }

        // Keyboard Listeners
        const KEY_MAP = {
            'ArrowUp': 'UP', 'KeyW': 'UP',
            'ArrowDown': 'DOWN', 'KeyS': 'DOWN',
            'ArrowLeft': 'LEFT', 'KeyA': 'LEFT',
            'ArrowRight': 'RIGHT', 'KeyD': 'RIGHT',
            'KeyX': 'A', 'KeyK': 'A', 'Space': 'A',
            'KeyZ': 'B', 'KeyJ': 'B',
            'Enter': 'START',
            'ShiftLeft': 'SELECT', 'ShiftRight': 'SELECT'
        };

        window.addEventListener('keydown', (e) => {
            const mapped = KEY_MAP[e.code];
            if (mapped) {
                e.preventDefault();
                setKeyState(mapped, true);
            }
        });

        window.addEventListener('keyup', (e) => {
            const mapped = KEY_MAP[e.code];
            if (mapped) {
                e.preventDefault();
                setKeyState(mapped, false);
            }
        });

        // On-Screen Tactile Button Listeners (Pointer Events for Mouse & Touch)
        document.querySelectorAll('[data-key]').forEach(btn => {
            const k = btn.getAttribute('data-key');
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                btn.setPointerCapture(e.pointerId);
                setKeyState(k, true);
            });
            btn.addEventListener('pointerup', (e) => {
                e.preventDefault();
                setKeyState(k, false);
            });
            btn.addEventListener('pointercancel', () => setKeyState(k, false));
