            '.022220.',
            '..0220..',
            '...00...',
            '........'
        ];
        const SPRITE_CHALICE = [
            '.000000.',
            '03233230',
            '02333320',
            '.023320.',
            '..0220..',
            '...00...',
            '.002200.',
            '00000000'
        ];

        let pq = {};

        function initPixelQuest() {
            // 4 rooms arranged in a 2x2 grid:
            // Room 0 (Top-Left: Entrance) -> Right to Room 1 (Armory)
            // Room 0 -> Down to Room 2 (Crypt) -> Right to Room 3 (Dragon Boss Lair)
            pq = {
                state: 'PLAY', // 'PLAY', 'WIN', 'GAMEOVER'
                room: 0,
                level: 1,
                score: 0,
                BannerTimer: 60,
                player: {
                    x: 76,
                    y: 80,
                    dir: 'DOWN', // UP, DOWN, LEFT, RIGHT
                    hp: 6,
                    maxHp: 6,
                    keys: 0,
                    attackTimer: 0,
                    invuln: 0,
                    dashTimer: 0
                },
                rooms: buildQuestDungeon(1)
            };
        }

        function buildQuestDungeon(dungeonLvl) {
            // Each room is 20x15 tiles (8x8px each), top 3 rows (24px) reserved for HUD
            // So playable arena is y: 24..144 (15 rows), x: 0..160 (20 cols)
            return [
                // Room 0: Entrance Hall (Exits: Right, Down)
                {
                    name: 'ENTRANCE HALL',
                    exits: { RIGHT: 1, DOWN: 2 },
                    locked: { DOWN: true },
                    blocks: [
                        { x: 32, y: 48, w: 16, h: 16 },
                        { x: 112, y: 48, w: 16, h: 16 },
                        { x: 32, y: 104, w: 16, h: 16 },
                        { x: 112, y: 104, w: 16, h: 16 }
                    ],
                    enemies: [
                        { type: 'SLIME', x: 56, y: 60, vx: 0.5, vy: 0.4, hp: 2, maxHp: 2, hurt: 0 },
                        { type: 'SLIME', x: 96, y: 96, vx: -0.5, vy: 0.5, hp: 2, maxHp: 2, hurt: 0 }
                    ],
                    items: []
                },
                // Room 1: Eastern Armory (Exits: Left) - Holds Key for Room 0's South Door!
                {
                    name: 'EAST ARMORY',
                    exits: { LEFT: 0 },
                    locked: {},
                    blocks: [
                        { x: 72, y: 64, w: 16, h: 32 }
                    ],
                    enemies: [
                        { type: 'SLIME', x: 48, y: 52, vx: 0.6, vy: 0.4, hp: 2, maxHp: 2, hurt: 0 },
                        { type: 'KNIGHT', x: 112, y: 80, vx: -0.45, vy: 0.45, hp: 4, maxHp: 4, hurt: 0 },
                        { type: 'SLIME', x: 108, y: 112, vx: 0.5, vy: -0.5, hp: 2, maxHp: 2, hurt: 0 }
                    ],
                    items: [
                        { type: 'KEY', x: 128, y: 80 },
                        { type: 'HEART', x: 40, y: 116 }
                    ]
                },
                // Room 2: Catacombs (Exits: Up, Right) - Holds Key to Boss Room!
                {
                    name: 'CATACOMBS',
                    exits: { UP: 0, RIGHT: 3 },
                    locked: { RIGHT: true },
                    blocks: [
                        { x: 48, y: 56, w: 64, h: 12 },
                        { x: 48, y: 100, w: 64, h: 12 }
                    ],
                    enemies: [
                        { type: 'KNIGHT', x: 32, y: 80, vx: 0.55, vy: 0.4, hp: 4, maxHp: 4, hurt: 0 },
                        { type: 'KNIGHT', x: 116, y: 80, vx: -0.5, vy: 0.5, hp: 4, maxHp: 4, hurt: 0 },
                        { type: 'SLIME', x: 80, y: 120, vx: 0.7, vy: 0.3, hp: 2, maxHp: 2, hurt: 0 }
                    ],
                    items: [
                        { type: 'KEY', x: 80, y: 80 },
                        { type: 'HEART', x: 24, y: 120 }
                    ]
                },
                // Room 3: Dragon Boss Lair (Exits: Left)
                {
                    name: 'DRAGON SANCTUM',
                    exits: { LEFT: 2 },
                    locked: {},
                    blocks: [
                        { x: 40, y: 48, w: 12, h: 12 },
                        { x: 108, y: 48, w: 12, h: 12 },
                        { x: 40, y: 112, w: 12, h: 12 },
                        { x: 108, y: 112, w: 12, h: 12 }
                    ],
                    enemies: [
                        { type: 'BOSS', x: 104, y: 76, vx: 0.55, vy: 0.55, hp: 8 + dungeonLvl * 2, maxHp: 8 + dungeonLvl * 2, hurt: 0, fireTimer: 0 }
                    ],
                    items: []
                }
            ];
        }

        function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
            return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
        }

        function updateAndDrawPixelQuest() {
            if (justPressed.SELECT) {
                switchCartridge('MENU');
                return;
            }

            if (pq.state !== 'PLAY') {
                clearScreen(3);
                fillRect(14, 28, 132, 88, 0);
                fillRect(16, 30, 128, 84, 2);
                drawTextCentered(pq.state === 'WIN' ? 'QUEST COMPLETE!' : 'YOU FELL...', 42, 0, 1);
                drawSprite(pq.state === 'WIN' ? SPRITE_CHALICE : SPRITE_HERO_DOWN, 72, 56, 2);
                drawTextCentered('SCORE: ' + pq.score, 80, 0, 1);
                drawTextCentered('PRESS A OR START', 96, 3, 1);
                if (justPressed.A || justPressed.START) {
                    if (pq.state === 'WIN') {
                        // Next Dungeon Floor with higher difficulty!
                        pq.level++;
                        pq.state = 'PLAY';
                        pq.room = 0;
                        pq.player.x = 76;
                        pq.player.y = 80;
                        pq.player.hp = pq.player.maxHp;
                        pq.rooms = buildQuestDungeon(pq.level);
                        SFX.select();
                    } else {
                        initPixelQuest();
                    }
                }
                return;
            }

            updateBGM('QUEST', true);

            const p = pq.player;
            const rm = pq.rooms[pq.room];

            // Movement & Dash
            if (justPressed.B && p.dashTimer === 0) {
                p.dashTimer = 10;
                SFX.cursor();
            }
            const spd = p.dashTimer > 0 ? 2.4 : 1.25;
            if (p.dashTimer > 0) p.dashTimer--;

            let dx = 0, dy = 0;
            if (keys.UP) { dy = -spd; p.dir = 'UP'; }
            else if (keys.DOWN) { dy = spd; p.dir = 'DOWN'; }
            if (keys.LEFT) { dx = -spd; p.dir = 'LEFT'; }
            else if (keys.RIGHT) { dx = spd; p.dir = 'RIGHT'; }

            // Sword Attack (A Button)
            if (justPressed.A && p.attackTimer === 0) {
                p.attackTimer = 14;
                SFX.sword();
            }
            if (p.attackTimer > 0) p.attackTimer--;
            if (p.invuln > 0) p.invuln--;

            // Apply Movement & Obstacle Collision
            const tryMove = (nx, ny) => {
                // Check interior obstacles
                for (const b of rm.blocks) {
                    if (rectOverlap(nx, ny, 8, 8, b.x, b.y, b.w, b.h)) return false;
                }
                // Check outer walls (8px border around 0..160, 24..144) except open doorways
                const inHorizDoor = (ny >= 74 && ny <= 88);
                const inVertDoor = (nx >= 72 && nx <= 84);

                if (nx < 8) {
                    if (rm.exits.LEFT !== undefined && inHorizDoor && !rm.locked.LEFT) return true;
                    return false;
                }
                if (nx + 8 > 152) {
                    if (rm.exits.RIGHT !== undefined && inHorizDoor && !rm.locked.RIGHT) return true;
                    if (rm.exits.RIGHT !== undefined && inHorizDoor && rm.locked.RIGHT && p.keys > 0) {
                        p.keys--;
                        rm.locked.RIGHT = false;
                        SFX.pickup();
                        return true;
                    }
                    return false;
                }
                if (ny < 32) {
                    if (rm.exits.UP !== undefined && inVertDoor && !rm.locked.UP) return true;
                    return false;
                }
                if (ny + 8 > 136) {
                    if (rm.exits.DOWN !== undefined && inVertDoor && !rm.locked.DOWN) return true;
                    if (rm.exits.DOWN !== undefined && inVertDoor && rm.locked.DOWN && p.keys > 0) {
                        p.keys--;
                        rm.locked.DOWN = false;
                        SFX.pickup();
                        return true;
                    }
                    return false;
                }
                return true;
            };

            if (dx !== 0 && tryMove(p.x + dx, p.y)) p.x += dx;
            if (dy !== 0 && tryMove(p.x, p.y + dy)) p.y += dy;

            // Room Transitions
            if (p.x < 4 && rm.exits.LEFT !== undefined) {
                pq.room = rm.exits.LEFT;
                p.x = 142;
            } else if (p.x > 148 && rm.exits.RIGHT !== undefined) {
                pq.room = rm.exits.RIGHT;
                p.x = 10;
            } else if (p.y < 28 && rm.exits.UP !== undefined) {
                pq.room = rm.exits.UP;
                p.y = 126;
            } else if (p.y > 132 && rm.exits.DOWN !== undefined) {
                pq.room = rm.exits.DOWN;
                p.y = 34;
            }

            // Compute Sword Hitbox
            let swordBox = null;
            if (p.attackTimer > 4) {
                if (p.dir === 'UP') swordBox = { x: p.x - 2, y: p.y - 10, w: 12, h: 10 };
                if (p.dir === 'DOWN') swordBox = { x: p.x - 2, y: p.y + 8, w: 12, h: 10 };
                if (p.dir === 'LEFT') swordBox = { x: p.x - 10, y: p.y - 2, w: 10, h: 12 };
                if (p.dir === 'RIGHT') swordBox = { x: p.x + 8, y: p.y - 2, w: 10, h: 12 };
            }

            // Update Items
            for (let i = rm.items.length - 1; i >= 0; i--) {
                const it = rm.items[i];
                if (rectOverlap(p.x, p.y, 8, 8, it.x, it.y, 8, 8)) {
                    SFX.pickup();
                    if (it.type === 'KEY') {
                        p.keys++;
                        pq.score += 100;
                    } else if (it.type === 'HEART') {
                        p.hp = Math.min(p.maxHp, p.hp + 2);
                        pq.score += 50;
                    } else if (it.type === 'CHALICE') {
                        pq.score += 1000 * pq.level;
                        saveHighScore('QUEST', pq.score);
                        pq.state = 'WIN';
                        SFX.victory();
                    }
                    rm.items.splice(i, 1);
                }
            }

            // Update Enemies
            for (let i = rm.enemies.length - 1; i >= 0; i--) {
                const e = rm.enemies[i];
                const size = e.type === 'BOSS' ? 16 : 8;
                if (e.hurt > 0) e.hurt--;

                // Move enemy
                e.x += e.vx;
                e.y += e.vy;

                if (e.x < 10 || e.x + size > 150) e.vx *= -1;
                if (e.y < 34 || e.y + size > 134) e.vy *= -1;
                for (const b of rm.blocks) {
                    if (rectOverlap(e.x, e.y, size, size, b.x, b.y, b.w, b.h)) {
                        e.vx *= -1;
                        e.vy *= -1;
                        e.x += e.vx * 2;
                        e.y += e.vy * 2;
                    }
                }

                // Sword Hit Check
                if (swordBox && e.hurt === 0 && rectOverlap(swordBox.x, swordBox.y, swordBox.w, swordBox.h, e.x, e.y, size, size)) {
                    e.hp--;
                    e.hurt = 12;
                    SFX.hit();
                    if (e.hp <= 0) {
                        pq.score += e.type === 'BOSS' ? 500 : (e.type === 'KNIGHT' ? 150 : 50);
                        saveHighScore('QUEST', pq.score);
                        if (e.type === 'BOSS') {
                            rm.items.push({ type: 'CHALICE', x: e.x, y: e.y });
                        } else if (Math.random() < 0.35) {
                            rm.items.push({ type: 'HEART', x: e.x, y: e.y });
                        }
                        rm.enemies.splice(i, 1);
                        continue;
                    }
                }

                // Player Damage Check
                if (p.invuln === 0 && rectOverlap(p.x, p.y, 8, 8, e.x, e.y, size, size)) {
                    p.hp--;
                    p.invuln = 40;
                    SFX.hit();
                    if (p.hp <= 0) {
                        saveHighScore('QUEST', pq.score);
                        pq.state = 'GAMEOVER';
                        SFX.gameOver();
                    }
                }
            }

            // RENDER PIXEL QUEST
            clearScreen(3);

            // Top HUD (0..24)
            fillRect(0, 0, SCREEN_W, 23, 0);
            drawText('HP:', 4, 4, 3, 1);
            for (let h = 0; h < p.maxHp / 2; h++) {
                const heartFull = p.hp >= (h + 1) * 2;
                const heartHalf = p.hp === h * 2 + 1;
                fillRect(24 + h * 9, 4, 7, 6, heartFull ? 3 : (heartHalf ? 2 : 1));
            }
            drawText('KEY:' + p.keys, 4, 14, 2, 1);
            drawText('SCR:' + pq.score, 52, 14, 3, 1);
            drawText(rm.name.slice(0, 12), 56, 4, 2, 1);

            // Dungeon Walls & Doors
            fillRect(0, 24, 160, 8, 1);   // Top Wall
            fillRect(0, 136, 160, 8, 1);  // Bottom Wall
            fillRect(0, 24, 8, 120, 1);   // Left Wall
            fillRect(152, 24, 8, 120, 1); // Right Wall
            strokeRect(7, 31, 146, 106, 0);

            // Carve Exits / Draw Locked Doors
            if (rm.exits.UP !== undefined) {
                fillRect(72, 24, 16, 8, rm.locked.UP ? 0 : 3);
            }
            if (rm.exits.DOWN !== undefined) {
                fillRect(72, 136, 16, 8, rm.locked.DOWN ? 0 : 3);
                if (rm.locked.DOWN) drawText('L', 78, 137, 3, 1);
            }
            if (rm.exits.LEFT !== undefined) {
                fillRect(0, 74, 8, 16, rm.locked.LEFT ? 0 : 3);
            }
            if (rm.exits.RIGHT !== undefined) {
                fillRect(152, 74, 8, 16, rm.locked.RIGHT ? 0 : 3);
                if (rm.locked.RIGHT) drawText('L', 154, 79, 3, 1);
            }

            // Interior Stone Pillars
            for (const b of rm.blocks) {
                fillRect(b.x, b.y, b.w, b.h, 1);
                strokeRect(b.x, b.y, b.w, b.h, 0);
            }

            // Items
            for (const it of rm.items) {
                const sp = it.type === 'KEY' ? SPRITE_KEY : (it.type === 'HEART' ? SPRITE_HEART : SPRITE_CHALICE);
                drawSprite(sp, it.x, it.y, 1);
            }

            // Enemies
            for (const e of rm.enemies) {
                if (e.hurt % 2 === 1) continue;
                if (e.type === 'BOSS') {
                    drawSprite(SPRITE_BOSS, e.x, e.y, 2);
                    // Boss HP bar
                    fillRect(e.x, e.y - 5, 16, 3, 0);
                    fillRect(e.x + 1, e.y - 4, Math.max(0, Math.floor((e.hp / e.maxHp) * 14)), 1, 2);
                } else {
                    drawSprite(e.type === 'KNIGHT' ? SPRITE_KNIGHT : SPRITE_SLIME, e.x, e.y, 1);
                }
            }

            // Player & Sword
            if (p.invuln % 2 === 0) {
                if (p.dir === 'UP') drawSprite(SPRITE_HERO_UP, p.x, p.y, 1);
                else if (p.dir === 'DOWN') drawSprite(SPRITE_HERO_DOWN, p.x, p.y, 1);
                else if (p.dir === 'LEFT') drawSprite(SPRITE_HERO_SIDE, p.x, p.y, 1, true);
                else drawSprite(SPRITE_HERO_SIDE, p.x, p.y, 1, false);
            }

            if (swordBox) {
                fillRect(swordBox.x, swordBox.y, swordBox.w, swordBox.h, 0);
                fillRect(swordBox.x + 2, swordBox.y + 2, swordBox.w - 4, swordBox.h - 4, 3);
            }
        }

        /***********************************************************************
         * 7. GAME 2: TETRA BLOCK (Authentic Game Boy Falling Block Puzzle)
         *    - 10x18 Grid (6x6px cells => 60x108px board) + Side HUD
         ***********************************************************************/
        const TETROMINOES = [
            { shape: [[1, 1, 1, 1]], shade: 1 },                  // I
            { shape: [[1, 1], [1, 1]], shade: 0 },                // O
            { shape: [[0, 1, 0], [1, 1, 1]], shade: 1 },          // T
            { shape: [[0, 1, 1], [1, 1, 0]], shade: 2 },          // S
            { shape: [[1, 1, 0], [0, 1, 1]], shade: 0 },          // Z
            { shape: [[1, 0, 0], [1, 1, 1]], shade: 1 },          // J
            { shape: [[0, 0, 1], [1, 1, 1]], shade: 2 }           // L
        ];

        let tb = {};

        function initTetraBlock() {
            const cols = 10;
            const rows = 18;
            const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
            tb = {
                cols,
                rows,
                grid,
                score: 0,
                lines: 0,
                level: 1,
                dropTick: 0,
                moveCooldown: 0,
                gameOver: false,
                current: null,
                next: randomTetromino()
            };
            spawnNextTetromino();
        }

        function randomTetromino() {
            const t = TETROMINOES[Math.floor(Math.random() * TETROMINOES.length)];
            return {
                shape: t.shape.map(r => [...r]),
                shade: t.shade
            };
        }

        function spawnNextTetromino() {
            tb.current = {
                shape: tb.next.shape,
                shade: tb.next.shade,
                x: Math.floor((tb.cols - tb.next.shape[0].length) / 2),
                y: 0
            };
            tb.next = randomTetromino();
            if (tetraCollides(tb.current.shape, tb.current.x, tb.current.y)) {
                tb.gameOver = true;
                saveHighScore('TETRA', tb.score);
                SFX.gameOver();
            }
        }

        function tetraCollides(shape, gx, gy) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (!shape[r][c]) continue;
                    const nx = gx + c;
                    const ny = gy + r;
                    if (nx < 0 || nx >= tb.cols || ny >= tb.rows) return true;
                    if (ny >= 0 && tb.grid[ny][nx] !== null) return true;
                }
            }
            return false;
        }

        function rotateMatrixCW(mat) {
            const rows = mat.length;
            const cols = mat[0].length;
            const res = Array.from({ length: cols }, () => Array(rows).fill(0));
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    res[c][rows - 1 - r] = mat[r][c];
                }
            }
            return res;
        }

        function lockTetromino() {
            const cur = tb.current;
            for (let r = 0; r < cur.shape.length; r++) {
                for (let c = 0; c < cur.shape[r].length; c++) {
                    if (cur.shape[r][c] && cur.y + r >= 0) {
                        tb.grid[cur.y + r][cur.x + c] = cur.shade;
                    }
                }
            }
            SFX.drop();

            // Check Full Lines
            let cleared = 0;
            for (let r = tb.rows - 1; r >= 0; r--) {
                if (tb.grid[r].every(cell => cell !== null)) {
                    tb.grid.splice(r, 1);
                    tb.grid.unshift(Array(tb.cols).fill(null));
                    cleared++;
                    r++;
                }
            }
            if (cleared > 0) {
                const pts = [0, 40, 100, 300, 1200][cleared] * tb.level;
                tb.score += pts;
                tb.lines += cleared;
                tb.level = 1 + Math.floor(tb.lines / 8);
                saveHighScore('TETRA', tb.score);
                SFX.lineClear();
            }
            spawnNextTetromino();
        }

        function updateAndDrawTetraBlock() {
            if (justPressed.SELECT) {
                switchCartridge('MENU');
                return;
            }

            if (tb.gameOver) {
                clearScreen(3);
                fillRect(18, 32, 124, 80, 0);
                fillRect(20, 34, 120, 76, 2);
                drawTextCentered('GAME OVER', 46, 0, 1);
                drawTextCentered('SCORE: ' + tb.score, 64, 0, 1);
                drawTextCentered('LINES: ' + tb.lines, 76, 0, 1);
                drawTextCentered('PRESS START', 94, 3, 1);
                if (justPressed.START || justPressed.A) initTetraBlock();
                return;
            }

            updateBGM('TETRA', true);

            const cur = tb.current;
            if (tb.moveCooldown > 0) tb.moveCooldown--;

            // Horizontal Movement
            if ((justPressed.LEFT || (keys.LEFT && tb.moveCooldown === 0))) {
                if (!tetraCollides(cur.shape, cur.x - 1, cur.y)) {
                    cur.x--;
                    SFX.cursor();
                }
                tb.moveCooldown = justPressed.LEFT ? 10 : 4;
            }
            if ((justPressed.RIGHT || (keys.RIGHT && tb.moveCooldown === 0))) {
                if (!tetraCollides(cur.shape, cur.x + 1, cur.y)) {
                    cur.x++;
                    SFX.cursor();
                }
                tb.moveCooldown = justPressed.RIGHT ? 10 : 4;
            }

            // Rotation (A or B)
            if (justPressed.A || justPressed.B) {
                let rotated = rotateMatrixCW(cur.shape);
                if (justPressed.B) rotated = rotateMatrixCW(rotateMatrixCW(rotated));
                if (!tetraCollides(rotated, cur.x, cur.y)) {
                    cur.shape = rotated;
                    SFX.rotate();
                } else if (!tetraCollides(rotated, cur.x - 1, cur.y)) {
                    cur.x--;
                    cur.shape = rotated;
                    SFX.rotate();
                } else if (!tetraCollides(rotated, cur.x + 1, cur.y)) {
                    cur.x++;
                    cur.shape = rotated;
                    SFX.rotate();
                }
            }

            // Instant Hard Drop (UP)
            if (justPressed.UP) {
                while (!tetraCollides(cur.shape, cur.x, cur.y + 1)) {
                    cur.y++;
                    tb.score += 2;
                }
                lockTetromino();
            } else {
                // Gravity + Soft Drop (DOWN)
                tb.dropTick++;
                const speed = keys.DOWN ? 3 : Math.max(6, 36 - (tb.level - 1) * 3);
                if (tb.dropTick >= speed) {
                    tb.dropTick = 0;
                    if (!tetraCollides(cur.shape, cur.x, cur.y + 1)) {
                        cur.y++;
                        if (keys.DOWN) tb.score += 1;
                    } else {
                        lockTetromino();
                    }
                }
            }

            // RENDER TETRA BLOCK
            clearScreen(2);

            const boardX = 12;
            const boardY = 10;
            const cell = 7; // 10*7 = 70px wide, 18*7 = 126px tall

            // Playfield Frame
            fillRect(boardX - 2, boardY - 2, tb.cols * cell + 4, tb.rows * cell + 4, 0);
            fillRect(boardX, boardY, tb.cols * cell, tb.rows * cell, 3);

            const drawBlockCell = (px, py, shade) => {
                fillRect(px, py, cell, cell, 0);
                fillRect(px + 1, py + 1, cell - 2, cell - 2, shade);
                fillRect(px + 2, py + 2, 2, 2, 3);
            };

            // Locked Blocks
            for (let r = 0; r < tb.rows; r++) {
                for (let c = 0; c < tb.cols; c++) {
                    if (tb.grid[r][c] !== null) {
                        drawBlockCell(boardX + c * cell, boardY + r * cell, tb.grid[r][c]);
                    }
                }
            }

            // Active Piece
            if (tb.current) {
                for (let r = 0; r < cur.shape.length; r++) {
                    for (let c = 0; c < cur.shape[r].length; c++) {
                        if (cur.shape[r][c]) {
                            drawBlockCell(boardX + (cur.x + c) * cell, boardY + (cur.y + r) * cell, cur.shade);
                        }
                    }
                }
            }

            // Right HUD Panel
            const hudX = 90;
            fillRect(hudX, 10, 62, 126, 0);
            fillRect(hudX + 2, 12, 58, 122, 3);

            drawText('SCORE', hudX + 6, 18, 0, 1);
            drawText(String(tb.score), hudX + 6, 27, 1, 1);

            drawText('LINES', hudX + 6, 42, 0, 1);
            drawText(String(tb.lines), hudX + 6, 51, 1, 1);

            drawText('LEVEL', hudX + 6, 66, 0, 1);
            drawText(String(tb.level), hudX + 6, 75, 1, 1);

            drawText('NEXT', hudX + 6, 90, 0, 1);
            strokeRect(hudX + 8, 99, 44, 28, 0);
            for (let r = 0; r < tb.next.shape.length; r++) {
                for (let c = 0; c < tb.next.shape[r].length; c++) {
                    if (tb.next.shape[r][c]) {
                        drawBlockCell(hudX + 14 + c * cell, 105 + r * cell, tb.next.shade);
                    }
                }
            }
        }

        /***********************************************************************
         * 8. GAME 3: STAR BLASTER (Vertical Scrolling Space Shooter)
         ***********************************************************************/
        const SPRITE_SHIP = [
            '...00...',
            '..0330..',
            '..0220..',
            '.001100.',
            '03011030',
            '02000020',
            '00.00.00',
            '...22...'
        ];
        const SPRITE_ALIEN_1 = [
            '.00..00.',
            '02200220',
            '00111100',
            '.013310.',
            '.011110.',
            '00.00.00',
            '0......0',
            '........'
        ];
        const SPRITE_DREADNOUGHT = [
            '..00000000..',
            '.0112222110.',
            '010013310010',
            '011111111110',
            '.0120110210.',
            '..00.00.00..'
        ];

        let sb = {};

        function initStarBlaster() {
            const stars = Array.from({ length: 22 }, () => ({
                x: Math.random() * SCREEN_W,
                y: 16 + Math.random() * (SCREEN_H - 16),
                spd: 0.5 + Math.random() * 1.2
            }));
            sb = {
                x: 76,
                y: 122,
                lives: 3,
                bombs: 2,
                score: 0,
                wave: 1,
                fireCooldown: 0,
                invuln: 0,
                bombFlash: 0,
                bullets: [],
                enemyBullets: [],
                enemies: [],
                particles: [],
                stars,
                spawnTick: 0,
                bossActive: false,
                gameOver: false
            };
        }

        function updateAndDrawStarBlaster() {
            if (justPressed.SELECT) {
                switchCartridge('MENU');
                return;
            }

            if (sb.gameOver) {
                clearScreen(0);
                fillRect(18, 34, 124, 76, 3);
                strokeRect(20, 36, 120, 72, 0);
                drawTextCentered('MISSION FAILED', 48, 0, 1);
                drawTextCentered('SCORE: ' + sb.score, 66, 1, 1);
                drawTextCentered('WAVE: ' + sb.wave, 78, 1, 1);
                drawTextCentered('PRESS START', 94, 0, 1);
                if (justPressed.START || justPressed.A) initStarBlaster();
                return;
            }

            updateBGM('STAR', true);

            // Player Ship Controls
            const spd = 1.8;
            if (keys.LEFT && sb.x > 6) sb.x -= spd;
            if (keys.RIGHT && sb.x < SCREEN_W - 14) sb.x += spd;
            if (keys.UP && sb.y > 24) sb.y -= spd;
            if (keys.DOWN && sb.y < SCREEN_H - 12) sb.y += spd;

            if (sb.fireCooldown > 0) sb.fireCooldown--;
            if (sb.invuln > 0) sb.invuln--;
            if (sb.bombFlash > 0) sb.bombFlash--;

            // Twin Lasers (A Button)
            if ((keys.A || justPressed.A) && sb.fireCooldown === 0) {
                sb.bullets.push({ x: sb.x + 1, y: sb.y - 4 });
                sb.bullets.push({ x: sb.x + 6, y: sb.y - 4 });
                sb.fireCooldown = 9;
                SFX.laser();
            }

            // Nova Bomb (B Button)
            if (justPressed.B && sb.bombs > 0) {
                sb.bombs--;
                sb.bombFlash = 12;
                sb.enemyBullets = [];
                SFX.explosion();
                for (let i = sb.enemies.length - 1; i >= 0; i--) {
                    sb.enemies[i].hp -= 6;
                    if (sb.enemies[i].hp <= 0) {
                        sb.score += sb.enemies[i].isBoss ? 500 : 50;
                        if (sb.enemies[i].isBoss) {
                            sb.bossActive = false;
                            sb.wave++;
                            sb.bombs = Math.min(3, sb.bombs + 1);
                        }
                        sb.enemies.splice(i, 1);
                    }
                }
                saveHighScore('STAR', sb.score);
            }

            // Spawn Enemies & Boss Dreadnoughts
            sb.spawnTick++;
            if (!sb.bossActive && sb.spawnTick > 0 && sb.spawnTick % 45 === 0) {
                const isSine = Math.random() < 0.45;
                sb.enemies.push({
                    x: 14 + Math.random() * 124,
                    y: 16,
                    vx: isSine ? 1.1 : 0,
                    vy: 0.65 + sb.wave * 0.1,
                    hp: 2,
                    maxHp: 2,
                    isBoss: false,
                    sine: isSine
                });
            }

            if (!sb.bossActive && sb.spawnTick >= 450) {
                sb.bossActive = true;
                sb.spawnTick = 0;
                sb.enemies.push({
                    x: 60,
                    y: 22,
                    vx: 0.9,
                    vy: 0,
                    hp: 18 + sb.wave * 6,
                    maxHp: 18 + sb.wave * 6,
                    isBoss: true
                });
            }

            // Update Player Bullets
            for (let i = sb.bullets.length - 1; i >= 0; i--) {
                sb.bullets[i].y -= 3.5;
                if (sb.bullets[i].y < 14) sb.bullets.splice(i, 1);
            }

            // Update Enemies
            for (let i = sb.enemies.length - 1; i >= 0; i--) {
                const e = sb.enemies[i];
                const w = e.isBoss ? 24 : 8;
                const h = e.isBoss ? 12 : 8;

                e.x += e.vx;
                e.y += e.vy;

                if (e.isBoss || e.sine) {
                    if (e.x < 8 || e.x + w > SCREEN_W - 8) e.vx *= -1;
                }

                // Enemy Firing
                if (Math.random() < (e.isBoss ? 0.05 : 0.012)) {
                    sb.enemyBullets.push({ x: e.x + w / 2, y: e.y + h, vy: 1.8 });
                }

                // Check Bullet Hits
                let destroyed = false;
                for (let b = sb.bullets.length - 1; b >= 0; b--) {
                    const bul = sb.bullets[b];
                    if (rectOverlap(bul.x, bul.y, 2, 4, e.x, e.y, w, h)) {
                        sb.bullets.splice(b, 1);
                        e.hp--;
                        if (e.hp <= 0) {
                            SFX.explosion();
                            sb.score += e.isBoss ? 500 : 40;
                            saveHighScore('STAR', sb.score);
                            for (let p = 0; p < 6; p++) {
                                sb.particles.push({
                                    x: e.x + w / 2,
                                    y: e.y + h / 2,
                                    vx: (Math.random() - 0.5) * 2.5,
                                    vy: (Math.random() - 0.5) * 2.5,
                                    life: 14
                                });
                            }
                            if (e.isBoss) {
                                sb.bossActive = false;
                                sb.wave++;
                                sb.bombs = Math.min(3, sb.bombs + 1);
                            }
                            sb.enemies.splice(i, 1);
                            destroyed = true;
                            break;
                        }
                    }
                }
                if (destroyed) continue;

                // Collide with Player
                if (sb.invuln === 0 && rectOverlap(sb.x, sb.y, 8, 8, e.x, e.y, w, h)) {
                    sb.lives--;
                    sb.invuln = 45;
                    SFX.hit();
                    if (sb.lives <= 0) {
                        saveHighScore('STAR', sb.score);
                        sb.gameOver = true;
                        SFX.gameOver();
                    }
                }

                if (!e.isBoss && e.y > SCREEN_H) {
                    sb.enemies.splice(i, 1);
                }
            }

            // Update Enemy Bullets
            for (let i = sb.enemyBullets.length - 1; i >= 0; i--) {
                const eb = sb.enemyBullets[i];
                eb.y += eb.vy;
                if (sb.invuln === 0 && rectOverlap(eb.x, eb.y, 2, 3, sb.x + 1, sb.y + 1, 6, 6)) {
                    sb.enemyBullets.splice(i, 1);
                    sb.lives--;
                    sb.invuln = 45;
                    SFX.hit();
                    if (sb.lives <= 0) {
                        saveHighScore('STAR', sb.score);
                        sb.gameOver = true;
                        SFX.gameOver();
                    }
                    continue;
                }
                if (eb.y > SCREEN_H) sb.enemyBullets.splice(i, 1);
            }

            // RENDER STAR BLASTER (Dark Space Shade 0 Background!)
            clearScreen(sb.bombFlash % 2 === 1 ? 3 : 0);

            // Scrolling Starfield
            for (const st of sb.stars) {
                st.y += st.spd;
                if (st.y > SCREEN_H) { st.y = 15; st.x = Math.random() * SCREEN_W; }
                fillRect(st.x, st.y, 1, 1, st.spd > 1.1 ? 3 : 2);
            }

            // Particles
            for (let i = sb.particles.length - 1; i >= 0; i--) {
                const pt = sb.particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                fillRect(pt.x, pt.y, 2, 2, 3);
                if (pt.life <= 0) sb.particles.splice(i, 1);
            }

            // Bullets
            for (const b of sb.bullets) fillRect(b.x, b.y, 2, 4, 3);
            for (const eb of sb.enemyBullets) fillRect(eb.x, eb.y, 2, 3, 2);

            // Enemies
            for (const e of sb.enemies) {
                if (e.isBoss) {
                    drawSprite(SPRITE_DREADNOUGHT, e.x, e.y, 2);
                    fillRect(e.x, e.y - 5, 24, 3, 1);
                    fillRect(e.x + 1, e.y - 4, Math.max(0, Math.floor((e.hp / e.maxHp) * 22)), 1, 3);
                } else {
                    drawSprite(SPRITE_ALIEN_1, e.x, e.y, 1);
                }
            }

            // Player Ship
            if (sb.invuln % 2 === 0) {
                drawSprite(SPRITE_SHIP, sb.x, sb.y, 1);
            }

            // Top HUD Bar
            fillRect(0, 0, SCREEN_W, 13, 2);
            fillRect(0, 13, SCREEN_W, 1, 3);
            drawText('SCR:' + sb.score, 4, 4, 0, 1);
            drawText('B:' + sb.bombs, 78, 4, 0, 1);
            drawText('LIVES:' + sb.lives, 112, 4, 0, 1);
        }

        /***********************************************************************
         * 9. GAME 4: SNAKE GB DX (Retro Arcade Snake with Bonus Bugs)
         ***********************************************************************/
        let sn = {};

        function initSnakeGB() {
            sn = {
                cols: 19,
                rows: 15,
                body: [
                    { x: 9, y: 7 },
                    { x: 8, y: 7 },
                    { x: 7, y: 7 }
                ],
                dir: { x: 1, y: 0 },
                nextDir: { x: 1, y: 0 },
                apple: { x: 13, y: 7 },
                bonusBug: null,
                score: 0,
                tick: 0,
                gameOver: false
            };
            spawnSnakeApple();
        }

        function spawnSnakeApple() {
            let valid = false;
            while (!valid) {
                const ax = Math.floor(Math.random() * sn.cols);
                const ay = Math.floor(Math.random() * sn.rows);
                valid = !sn.body.some(seg => seg.x === ax && seg.y === ay);
                if (valid) sn.apple = { x: ax, y: ay };
            }
        }

        function updateAndDrawSnakeGB() {
            if (justPressed.SELECT) {
                switchCartridge('MENU');
                return;
            }

            if (sn.gameOver) {
                clearScreen(3);
                fillRect(20, 34, 120, 74, 0);
                fillRect(22, 36, 116, 70, 2);
                drawTextCentered('SNAKE CRASHED!', 48, 0, 1);
                drawTextCentered('SCORE: ' + sn.score, 66, 0, 1);
                drawTextCentered('HI: ' + highScores.SNAKE, 78, 1, 1);
                drawTextCentered('PRESS START', 94, 3, 1);
                if (justPressed.START || justPressed.A) initSnakeGB();
                return;
            }

            updateBGM('SNAKE', true);

            if ((keys.UP || justPressed.UP) && sn.dir.y === 0) sn.nextDir = { x: 0, y: -1 };
            else if ((keys.DOWN || justPressed.DOWN) && sn.dir.y === 0) sn.nextDir = { x: 0, y: 1 };
            else if ((keys.LEFT || justPressed.LEFT) && sn.dir.x === 0) sn.nextDir = { x: -1, y: 0 };
            else if ((keys.RIGHT || justPressed.RIGHT) && sn.dir.x === 0) sn.nextDir = { x: 1, y: 0 };

            sn.tick++;
            if (sn.bonusBug) {
                sn.bonusBug.timer--;
                if (sn.bonusBug.timer <= 0) sn.bonusBug = null;
            }

            const speed = keys.A ? 5 : Math.max(5, 11 - Math.floor(sn.score / 80));
            if (sn.tick >= speed) {
                sn.tick = 0;
                sn.dir = sn.nextDir;
                const head = {
                    x: sn.body[0].x + sn.dir.x,
                    y: sn.body[0].y + sn.dir.y
                };

                // Wall or Self Collision
                if (
                    head.x < 0 || head.x >= sn.cols ||
                    head.y < 0 || head.y >= sn.rows ||
                    sn.body.some(s => s.x === head.x && s.y === head.y)
                ) {
                    saveHighScore('SNAKE', sn.score);
                    sn.gameOver = true;
                    SFX.gameOver();
                    return;
                }

                sn.body.unshift(head);

                if (head.x === sn.apple.x && head.y === sn.apple.y) {
                    sn.score += 10;
                    saveHighScore('SNAKE', sn.score);
                    SFX.pickup();
                    spawnSnakeApple();
                    if (!sn.bonusBug && Math.random() < 0.35) {
                        sn.bonusBug = {
                            x: Math.floor(Math.random() * sn.cols),
                            y: Math.floor(Math.random() * sn.rows),
                            timer: 95
                        };
                    }
                } else if (sn.bonusBug && head.x === sn.bonusBug.x && head.y === sn.bonusBug.y) {
                    sn.score += 50;
                    saveHighScore('SNAKE', sn.score);
                    sn.bonusBug = null;
                    SFX.lineClear();
                } else {
                    sn.body.pop();
                }
            }

            // RENDER SNAKE GB
            clearScreen(3);

            // Top HUD
            fillRect(0, 0, SCREEN_W, 15, 0);
            drawText('SNAKE DX', 4, 5, 3, 1);
            drawText('SCR:' + sn.score, 66, 5, 2, 1);
            drawText('HI:' + highScores.SNAKE, 118, 5, 3, 1);

            // Arena Frame (19*8 = 152px wide, 15*8 = 120px tall)
            const ox = 4;
            const oy = 19;
            strokeRect(ox - 2, oy - 2, sn.cols * 8 + 4, sn.rows * 8 + 4, 0);

            // Apple
            fillRect(ox + sn.apple.x * 8 + 1, oy + sn.apple.y * 8 + 1, 6, 6, 0);
            fillRect(ox + sn.apple.x * 8 + 2, oy + sn.apple.y * 8 + 2, 2, 2, 3);

            // Bonus Bug
            if (sn.bonusBug && Math.floor(sn.bonusBug.timer / 4) % 2 === 0) {
                strokeRect(ox + sn.bonusBug.x * 8, oy + sn.bonusBug.y * 8, 8, 8, 0);
                fillRect(ox + sn.bonusBug.x * 8 + 2, oy + sn.bonusBug.y * 8 + 2, 4, 4, 1);
            }

            // Snake Body & Head
            sn.body.forEach((seg, idx) => {
                const px = ox + seg.x * 8;
                const py = oy + seg.y * 8;
                if (idx === 0) {
                    fillRect(px, py, 8, 8, 0);
                    fillRect(px + 2, py + 2, 2, 2, 3);
                } else {
                    fillRect(px + 1, py + 1, 6, 6, idx % 2 === 0 ? 0 : 1);
                }
            });
        }

        /***********************************************************************
         * 9B. GAME 5: TURBO RACER GB (DMG-TR-04 - Retro F-1 Highway Racer)
         *     - 3-Lane Highway with Scrolling Kerbs, Rival Cars & Oil Slicks
         *     - Hold A for Turbo Boost, Hold B for Brakes, Pass Checkpoints!
         ***********************************************************************/
        const SPRITE_RACE_CAR = [
            '..0000..',
            '.013310.',
            '00122100',
            '00133100',
            '..0220..',
            '00122100',
            '00011000',
            '..0..0..'
        ];
        const SPRITE_RIVAL_CAR = [
            '..0000..',
            '00111100',
            '00122100',
            '..0110..',
            '00133100',
            '00122100',
            '.000000.',
            '........'
        ];
        const SPRITE_OIL_SLICK = [
            '..0000..',
            '.010010.',
            '00010000',
            '01000010',
            '.000100.',
            '..0000..'
        ];

        let tr = {};

        function initTurboRacer() {
            tr = {
                x: 76,
                y: 114,
                speed: 1.5,
                maxSpeed: 3.8,
                score: 0,
                distance: 0,
                nextCheckpoint: 600,
                stage: 1,
                timeLeft: 45 * 60, // 45 seconds at 60fps
                shield: 3,
                invuln: 0,
                skidTimer: 0,
                roadScroll: 0,
                spawnTick: 0,
                checkpointBannerTimer: 0,
                rivals: [],
                oils: [],
                gameOver: false
            };
        }

        function updateAndDrawTurboRacer() {
            if (justPressed.SELECT) {
                switchCartridge('MENU');
                return;
            }

            if (tr.gameOver) {
                clearScreen(3);
                fillRect(16, 30, 128, 84, 0);
                fillRect(18, 32, 124, 80, 2);
                drawTextCentered('RACE OVER!', 42, 0, 1);
                drawTextCentered('SCORE: ' + tr.score, 58, 0, 1);
                drawTextCentered('STAGE: ' + tr.stage, 70, 1, 1);
                drawTextCentered('HI: ' + highScores.RACE, 82, 1, 1);
                drawTextCentered('PRESS START', 96, 3, 1);
                if (justPressed.START || justPressed.A) initTurboRacer();
                return;
            }

            updateBGM('RACE', true);

            // Acceleration / Turbo (A) & Brakes (B)
            const targetMax = keys.A ? (tr.maxSpeed + 1.1) : tr.maxSpeed;
            if (keys.B) {
                tr.speed = Math.max(0.9, tr.speed - 0.08);
            } else if (tr.speed < targetMax) {
                tr.speed = Math.min(targetMax, tr.speed + (keys.A ? 0.045 : 0.025));
            } else {
                tr.speed = Math.max(targetMax, tr.speed - 0.03);
            }

            // Steering (Left / Right) + Oil Skid Effect
            if (tr.skidTimer > 0) {
                tr.skidTimer--;
                tr.x += Math.sin(tr.skidTimer * 0.8) * 1.8;
            } else {
                const steerSpd = 1.75;
                if (keys.LEFT) tr.x -= steerSpd;
                if (keys.RIGHT) tr.x += steerSpd;
            }
            // Clamp to road boundaries (Road is x: 34..126, width 92)
            tr.x = Math.max(38, Math.min(114, tr.x));

            if (tr.invuln > 0) tr.invuln--;
            if (tr.checkpointBannerTimer > 0) tr.checkpointBannerTimer--;

            // Advance Road & Distance
            tr.roadScroll = (tr.roadScroll + tr.speed) % 16;
            tr.distance += tr.speed;
            tr.score += Math.floor(tr.speed);
            saveHighScore('RACE', tr.score);

            // Countdown Timer & Checkpoints
            tr.timeLeft--;
            if (tr.distance >= tr.nextCheckpoint) {
                tr.stage++;
                tr.nextCheckpoint += 700 + tr.stage * 150;
                tr.timeLeft = Math.min(60 * 60, tr.timeLeft + 22 * 60);
                tr.score += 250 * tr.stage;
                tr.checkpointBannerTimer = 75;
                saveHighScore('RACE', tr.score);
                SFX.lineClear();
            }

            if (tr.timeLeft <= 0) {
                tr.gameOver = true;
                saveHighScore('RACE', tr.score);
                SFX.gameOver();
                return;
            }

            // Spawn Rival Cars & Oil Slicks in 3 Lanes (x = 46, 76, 104)
            tr.spawnTick++;
            const spawnRate = Math.max(24, 48 - tr.stage * 3);
            if (tr.spawnTick >= spawnRate) {
                tr.spawnTick = 0;
                const lanes = [46, 76, 104];
                const laneX = lanes[Math.floor(Math.random() * lanes.length)];
                if (Math.random() < 0.22) {
                    tr.oils.push({ x: laneX, y: 14 });
                } else {
                    tr.rivals.push({
                        x: laneX + (Math.random() - 0.5) * 6,
                        y: 12,
                        spd: 0.9 + Math.random() * 1.1,
                        drift: (Math.random() < 0.3) ? (Math.random() < 0.5 ? -0.25 : 0.25) : 0
                    });
                }
            }

            // Update Oil Slicks
            for (let i = tr.oils.length - 1; i >= 0; i--) {
                const o = tr.oils[i];
                o.y += tr.speed;
                if (tr.skidTimer === 0 && rectOverlap(tr.x, tr.y, 8, 8, o.x, o.y, 8, 6)) {
                    tr.skidTimer = 22;
                    tr.speed = Math.max(1.2, tr.speed - 1.2);
                    SFX.rotate();
                    tr.oils.splice(i, 1);
                    continue;
                }
                if (o.y > SCREEN_H) tr.oils.splice(i, 1);
            }

            // Update Rival Cars
            for (let i = tr.rivals.length - 1; i >= 0; i--) {
                const rv = tr.rivals[i];
                rv.y += (tr.speed - rv.spd + 0.8);
                rv.x += rv.drift;
                if (rv.x < 40 || rv.x > 112) rv.drift *= -1;

                if (tr.invuln === 0 && rectOverlap(tr.x + 1, tr.y + 1, 6, 7, rv.x + 1, rv.y + 1, 6, 7)) {
                    tr.shield--;
                    tr.invuln = 45;
                    tr.speed = 1.0;
                    SFX.explosion();
                    tr.rivals.splice(i, 1);
                    if (tr.shield <= 0) {
                        tr.gameOver = true;
                        saveHighScore('RACE', tr.score);
                        SFX.gameOver();
                        return;
                    }
                    continue;
                }

                if (rv.y > SCREEN_H) {
                    tr.score += 25;
                    tr.rivals.splice(i, 1);
                }
            }

            // RENDER TURBO RACER GB
            clearScreen(2); // Grass verge shade 2

            // Highway Asphalt (x: 34..126)
            fillRect(34, 15, 92, SCREEN_H - 15, 3);

            // Animated Red/White Road Kerbs & Roadside Posts
            const offset = Math.floor(tr.roadScroll);
            for (let y = 15 - offset; y < SCREEN_H; y += 8) {
                const kerbShade = Math.floor((y + offset) / 8) % 2 === 0 ? 0 : 3;
                fillRect(30, y, 4, 8, kerbShade);
                fillRect(126, y, 4, 8, kerbShade);
            }
            for (let y = 15 + offset; y < SCREEN_H; y += 16) {
                // Dashed Lane Dividers
                fillRect(64, y, 2, 8, 1);
                fillRect(94, y, 2, 8, 1);
                // Roadside Shrubs/Posts
                fillRect(14, y, 6, 6, 1);
                fillRect(140, y, 6, 6, 1);
            }

            // Oil Slicks
            for (const o of tr.oils) {
                drawSprite(SPRITE_OIL_SLICK, o.x, o.y, 1);
            }

            // Rival Cars
            for (const rv of tr.rivals) {
                drawSprite(SPRITE_RIVAL_CAR, rv.x, rv.y, 1);
            }

            // Player F-1 Turbo Car
            if (tr.invuln % 2 === 0) {
                drawSprite(SPRITE_RACE_CAR, tr.x, tr.y, 1);
                // Exhaust flame when holding A (Turbo)
                if (keys.A && Math.floor(tr.roadScroll) % 2 === 0) {
                    fillRect(tr.x + 2, tr.y + 8, 4, 3, 0);
                }
            }

            // Checkpoint Banner Popup
            if (tr.checkpointBannerTimer > 0 && Math.floor(tr.checkpointBannerTimer / 5) % 2 === 0) {
                fillRect(38, 44, 84, 15, 0);
                drawTextCentered('CHECKPOINT!', 49, 3, 1);
            }

            // Top Telemetry HUD Bar
            fillRect(0, 0, SCREEN_W, 15, 0);
            const kmh = Math.floor(tr.speed * 58);
            drawText(kmh + 'KM', 4, 5, 3, 1);
            drawText('T:' + Math.ceil(tr.timeLeft / 60), 46, 5, 2, 1);
            drawText('HP:' + tr.shield, 84, 5, 3, 1);
            drawText('S:' + tr.stage, 122, 5, 2, 1);
        }

        /***********************************************************************
         * 10. MASTER 60FPS CONSOLE SIMULATION LOOP
         ***********************************************************************/
        function gameLoop() {
            if (!powerOn) {
                // Powered-Off LCD Appearance
                ctx.fillStyle = '#7e8c54';
                ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
            } else {
                switch (currentCart) {
                    case 'BOOT':
                    case 'NOCART':
                        updateAndDrawBoot();
                        break;
                    case 'MENU':
                        updateAndDrawMenu();
                        break;
                    case 'QUEST':
                        updateAndDrawPixelQuest();
                        break;
                    case 'TETRA':
                        updateAndDrawTetraBlock();
                        break;
                    case 'STAR':
                        updateAndDrawStarBlaster();
                        break;
                    case 'SNAKE':
                        updateAndDrawSnakeGB();
                        break;
                    case 'RACE':
                        updateAndDrawTurboRacer();
                        break;
                }
            }

            clearJustPressed();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            renderCartridgeRack();
            updateTopSlotVisual(PHYSICAL_CARTRIDGES[0], 'seated');
            startBootSequence('MENU');
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
