                </div>

                <!-- 6 Physical Game Boy Cartridges Grid -->
                <div id="cartridge-rack-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- Populated dynamically by renderCartridgeRack() -->
                </div>
            </div>

            <!-- Active Cartridge Manual & Controls Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                <!-- Active Cartridge Manual Card -->
                <div class="bg-slate-900/85 border border-slate-700/80 rounded-2xl p-4 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 mb-2.5">
                            <div>
                                <span id="manual-code" class="text-[10px] font-bold font-mono uppercase tracking-wider text-emerald-400">DMG-4IN1-GOLD</span>
                                <h3 id="manual-title" class="text-xs sm:text-sm font-bold text-white pixel-font mt-0.5">5-IN-1 MULTICART</h3>
                            </div>
                            <button onclick="rebootCurrentCartridge()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-semibold text-amber-300 border border-slate-600 transition" title="Reboot Console with Current Cartridge">
                                ↻ Reboot
                            </button>
                        </div>

                        <p id="manual-desc" class="text-xs text-slate-300 leading-relaxed mb-3">
                            Use <strong class="text-emerald-300">UP / DOWN</strong> on the D-Pad to choose from 5 built-in 8-bit games, then press <strong class="text-emerald-300">A</strong> or <strong class="text-emerald-300">START</strong> to launch!
                        </p>
                    </div>

                    <div id="manual-tips" class="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5 text-[11px] text-slate-300 space-y-1">
                        <div>💡 <strong>TIP:</strong> Click any physical Game Pak above to swap cartridges with a realistic top-slot insertion!</div>
                        <div>🕹️ Press <strong>SELECT</strong> (Shift) during a game on the Multicart to return to the Multicart menu.</div>
                    </div>
                </div>

                <!-- Controls & Battery-Backed SRAM High Scores -->
                <div class="flex flex-col gap-3.5">
                    <!-- Keyboard & Touch Controls Reference -->
                    <div class="bg-slate-900/85 border border-slate-700/80 rounded-2xl p-3.5 shadow-xl">
                        <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 flex items-center justify-between">
                            <span>Controls Guide</span>
                            <span class="text-[10px] text-emerald-400 font-normal">Keyboard + Touch</span>
                        </h3>
                        <div class="grid grid-cols-2 gap-1.5 text-[11px]">
                            <div class="bg-slate-800/70 rounded-lg px-2 py-1.5 border border-slate-700/60 flex items-center justify-between">
