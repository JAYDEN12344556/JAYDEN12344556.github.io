        function filterCartRack(category) {
            activeRackFilter = category;
            ['ALL', 'ACTION', 'ARCADE'].forEach(cat => {
                const btn = document.getElementById('filter-' + cat);
                if (btn) {
                    btn.className = (cat === category)
                        ? 'px-2.5 py-1 rounded-lg font-semibold bg-emerald-600 text-white transition'
                        : 'px-2 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition';
                }
            });
            SFX.cursor();
            renderCartridgeRack();
        }

        function updateTopSlotVisual(cartObj, stateClass) {
            const slotEl = document.getElementById('top-slot-cart');
            const codeEl = document.getElementById('top-slot-code');
            const stickerEl = document.getElementById('top-slot-sticker');
            const headerLabel = document.getElementById('header-cart-label');
            const dotEl = document.getElementById('slot-status-dot');

            if (!slotEl) return;

            // Remove old shell classes
            slotEl.classList.remove('cart-shell-gold', 'cart-shell-grey', 'cart-shell-blue', 'cart-shell-yellow', 'cart-shell-red', 'ejected', 'inserting', 'seated');

            if (!cartObj) {
                slotEl.classList.add('cart-shell-grey', 'ejected');
                if (headerLabel) headerLabel.textContent = 'NO CARTRIDGE';
                if (dotEl) dotEl.className = 'w-2 h-2 rounded-full bg-rose-500';
                return;
            }

            slotEl.classList.add(cartObj.shellClass, stateClass);
            if (codeEl) codeEl.textContent = cartObj.code;
            if (stickerEl) stickerEl.className = `w-[88%] h-2.5 mt-1 rounded-t-xs bg-gradient-to-r ${cartObj.stickerGrad} border-t border-x border-white/50`;
            if (headerLabel) headerLabel.textContent = cartObj.code;
            if (dotEl) dotEl.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        }

        function insertCartridgeFromRack(cartId) {
            const cartObj = PHYSICAL_CARTRIDGES.find(c => c.id === cartId);
            if (!cartObj) return;

            ensureAudio();
            insertedCartId = cartId;
            renderCartridgeRack();

            // Animate eject & snap-in on top of the Game Boy shell
            updateTopSlotVisual(cartObj, 'inserting');
            setTimeout(() => {
                SFX.cartClunk();
                updateTopSlotVisual(cartObj, 'seated');
            }, 90);

            if (!powerOn) {
                togglePower();
            } else {
                startBootSequence(cartId);
            }
        }

        function ejectCartridge() {
            if (!insertedCartId) return;
            ensureAudio();
            SFX.cartEject();
            insertedCartId = null;
            updateTopSlotVisual(null, 'ejected');
            renderCartridgeRack();
            document.getElementById('active-cart-badge').textContent = 'EMPTY';
            updateManualPanel('NOCART');
            if (powerOn) {
                startBootSequence('NOCART');
            }
        }

        function rebootCurrentCartridge() {
            SFX.select();
            if (!powerOn) {
                togglePower();
            } else {
                startBootSequence(insertedCartId || 'NOCART');
            }
        }

        function startBootSequence(targetCart = insertedCartId || 'NOCART') {
            currentCart = 'BOOT';
            bootTargetCart = targetCart;
            bootY = -14;
            bootTimer = 0;
            bootDingPlayed = false;
            updateManualPanel(targetCart);
        }

        function switchCartridge(cartId) {
            if (!powerOn) togglePower();
            SFX.select();
            bgmStep = 0;
            currentCart = cartId;
            updateManualPanel(cartId);

            document.getElementById('active-cart-badge').textContent =
                cartId === 'MENU' ? '5-IN-1' : (cartId === 'NOCART' ? 'EMPTY' : cartId);

            if (cartId === 'QUEST') initPixelQuest();
            if (cartId === 'TETRA') initTetraBlock();
            if (cartId === 'STAR') initStarBlaster();
            if (cartId === 'SNAKE') initSnakeGB();
            if (cartId === 'RACE') initTurboRacer();
        }

        function updateManualPanel(cartId) {
            const codeEl = document.getElementById('manual-code');
            const titleEl = document.getElementById('manual-title');
            const descEl = document.getElementById('manual-desc');
            if (cartId === 'NOCART') {
                if (codeEl) codeEl.textContent = 'SLOT-1 EMPTY';
                titleEl.textContent = 'NO CARTRIDGE';
                descEl.innerHTML = 'No Game Pak is inserted in Slot-1! Click any of the <strong>6 physical Game Boy cartridges</strong> in the rack above to slide it into the console.';
                return;
            }
            const info = PHYSICAL_CARTRIDGES.find(c => c.id === cartId) || PHYSICAL_CARTRIDGES[0];
            if (info) {
                if (codeEl) codeEl.textContent = info.code;
                titleEl.textContent = info.title;
                descEl.textContent = info.desc;
            }
        }

        // Update & Render Boot Sequence (Supports both Valid Cartridges & Ejected Lockout Screen)
        function updateAndDrawBoot() {
            clearScreen(3);
            if (bootY < 60) {
                bootY += 1.3;
            } else {
                if (!bootDingPlayed) {
                    bootDingPlayed = true;
                    if (bootTargetCart === 'NOCART') {
                        SFX.bootError();
                    } else {
                        SFX.bootDing();
                    }
                }
                bootTimer++;
                if (bootTargetCart !== 'NOCART' && (bootTimer > 58 || justPressed.A || justPressed.START)) {
                    switchCartridge(bootTargetCart);
                    return;
                }
            }

            const y = Math.floor(bootY);
            if (bootTargetCart === 'NOCART') {
                // Classic No-Cartridge Garbled Black Rectangle Lockout
                fillRect(32, y - 2, 96, 14, 0);
                for (let gx = 36; gx < 124; gx += 6) {
                    fillRect(gx, y + 1, 3, 8, (gx % 12 === 0) ? 1 : 0);
                }
                if (bootDingPlayed) {
                    drawTextCentered('NO GAME PAK', y + 24, 1, 1);
                    drawTextCentered('INSERT CARTRIDGE', y + 34, 2, 1);
                }
            } else {
                // Classic Boxed Drop Logo
                fillRect(30, y - 4, 100, 19, 0);
                fillRect(32, y - 2, 96, 15, 3);
                drawTextCentered('GEMINI BOY', y + 2, 0, 1);
                if (bootDingPlayed) {
                    const pak = PHYSICAL_CARTRIDGES.find(c => c.id === bootTargetCart);
                    drawTextCentered(pak ? pak.code : 'TM 1989-2026', y + 22, 1, 1);
                }
            }
        }

